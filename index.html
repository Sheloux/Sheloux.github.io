<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trop Tôt</title>
    <link rel="icon" type="image/x-icon" href="Assets/car.png">
    <link rel="stylesheet" href="style.css">

        </div>
    </section>

    <!-- Section 2 -->
    <section class="section-2">
        <div class="container">

                Avant même de grandir, ils apprennent déjà à désirer.
            </h2>

        <div class="img-container">

            <img src="Assets/img2.png" alt="" class="section-2-image" id="img-2">
        </div>
    </section>

    <section class="section-3">
        <div class="img-container">

            <video autoplay muted loop id="myVideo2">

            <img src="Assets/img3.png" alt="" id="img-3">

        <div class="container">
            <h2 class="split"> Les enfants ne naissent pas <br> consommateur. <br> On les y forme.
            </h2>
        </div>

        <div class="img-container">
            <img src="Assets/img5.png" alt="" id="img-5">

        <div>
            <div class="img-container">

                <img src="Assets/img7.png" alt="" id="img-7">
                <img src="Assets/img10.png" alt="" id="img-10">
                <img src="Assets/img11.png" alt="" id="img-11">
                <img src="Assets/img13.png" alt="" id="img-13">
                <img src="Assets/img14.png" alt="" id="img-14">
                <img src="Assets/img15.png" alt="" id="img-15">
            </div>

                <h2>Trop tôt pour vouloir, trop tard pour s’en rendre compte?</h2>
            </div>

    <script src="letterAnim.js"></script>
